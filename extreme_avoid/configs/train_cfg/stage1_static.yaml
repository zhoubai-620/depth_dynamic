# Stage 1: Static Environment (Baseline)
# Reuses original NavigationEnv with static geodesic fields.
# Goal: Learn basic hover + static obstacle avoidance.
# No dynamic obstacles, no perception backbone.
#
# Corresponds to DepthNav's level0/level1 curriculum.

env_class: "navigation_env"

env:
  num_envs: 1
  max_episode_steps: 256
  visual: true
  single_env: true
  requires_grad: true
  device: "cuda"
  robot_radius: 0.1

  action_type: "THRUST_YAW"
  inertial_frame: "START"
  target_type: "TARGET_VELOCITY_TARGET_DISTANCE"

  dynamics_kwargs:
    action_type: "thrust_start_frame"
    ctrl_dt: 0.02
    dt: 0.0025
    grad_decay: 0.005
    enable_air_drag: true
    air_drag_theta_1: 0.1
    air_drag_theta_2: 0.1
    enable_ctrl_smoothing: true
    exp_smoothing_factor: 12.0
    vel_smoothing_factor: 0.5

  reward_kwargs:
    beta_1: 2.5
    beta_2: -32
    lambda_v: 1
    lambda_c: 2
    lambda_a: 0.01
    lambda_j: 0.001
    lambda_om: 0.03
    lambda_yaw: 0.5
    lambda_vmax: 0.0
    falloff_dis: 1.0
    safe_view_degrees: 10.0

  scene_kwargs:
    spawn_obstacles: true
    load_geodesics: true
    num_obstacles: 15
    obstacle_type: "cuboid"
    obstacle_min_size: [0.2, 0.2, 0.2]
    obstacle_max_size: [1.0, 1.0, 4.0]

  sensor_kwargs:
    - uuid: "depth"
      sensor_type: "depth"
      resolution: [64, 64]
      near: 0.05
      far: 20.0

train_bptt:
  iterations: 500    # Level 0 style
  horizon: 16
  gamma: 0.99
  learning_rate_init: 3e-4
  learning_rate_final: 1e-5
  weight_decay: 0.0
  log_interval: 10
  checkpoint_interval: 500
  early_stop_reward_threshold: -100.0

policy_class: "MlpPolicy"

policy:
  in_dim: 7
  net_arch:
    mlp_layer: [256, 128, 4]
  activation_fn: "relu"
  output_activation_fn: "acceleration_bounded_yaw"
